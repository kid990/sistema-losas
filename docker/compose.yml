name: sirlod

x-fastapi-build: &fastapi-build
  context: ..
  dockerfile: docker/backend_fastapi/Dockerfile

x-fastapi-service: &fastapi-service
  image: sirlod-fastapi:local
  env_file:
    - ../backend_fastapi/.env.docker
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - runtime_data:/app/runtime
  networks:
    - private
    - public

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sirlod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-losa}
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-false}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../PG:/sql:ro
      - ./database/postgres/init.sh:/docker-entrypoint-initdb.d/10-sirlod-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_dev_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-api_unheval}
      MYSQL_USER: ${MYSQL_USER:-unheval}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql_dev_change_me}
    ports:
      - "127.0.0.1:${MYSQL_PORT_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../DB:/sql:ro
      - ./database/mysql/init.sh:/docker-entrypoint-initdb.d/10-unheval-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - private

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_change_me}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_change_me}
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

  backend-api:
    image: sirlod-unheval-api:local
    build:
      context: ..
      dockerfile: docker/backend_api/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../backend_api/.env.docker
    ports:
      - "127.0.0.1:${BACKEND_API_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/test"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

  backend-fastapi:
    <<: *fastapi-service
    build: *fastapi-build
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "127.0.0.1:${BACKEND_FASTAPI_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery-worker:
    <<: *fastapi-service
    command:
      - celery
      - --app
      - app.queue.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=default,reports,documents,emails,sync
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.queue.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    <<: *fastapi-service
    profiles: ["scheduler"]
    command:
      - celery
      - --app
      - app.queue.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/app/runtime/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  flower:
    <<: *fastapi-service
    profiles: ["monitoring"]
    command:
      - celery
      - --app
      - app.queue.celery_app:celery_app
      - flower
      - --port=5555
    environment:
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower_dev_change_me}
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: sirlod-frontend:local
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../frontend/.env.docker
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend-fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - public

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  runtime_data:

networks:
  private:
    internal: true
  public:
