services:
  nginx:
    image: sirlod-nginx:1.30.7
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      backend-fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - public

  frontend:
    build:
      args:
        VITE_API_BASE_URL_OVERRIDE: /api
    ports: !reset []
    environment:
      NODE_ENV: production

  backend-fastapi:
    ports: !reset []
    environment:
      APP_ENV: production
      FRONTEND_URL: "${PUBLIC_URL:?Define PUBLIC_URL en docker/.env}"
      CORS_ORIGINS: "[\"${PUBLIC_URL:?Define PUBLIC_URL en docker/.env}\"]"

  backend-api:
    ports: !reset []

  postgres:
    ports: !reset []

  mysql:
    ports: !reset []

  redis:
    ports: !reset []

  flower:
    ports: !reset []

  # La predicción diaria se conserva en producción. El modelo se monta desde
  # ml/models (subir rf04_ocupacion.joblib al servidor antes de desplegar).
  ml-cron:
    restart: always
